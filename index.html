<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>QuickNotes Manager</h1>
      <p>Frontend integration prototype with REST API</p>
    </header>

    <section class="actions-section">
      <button id="load-btn">Load notes</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="form-section">
      <h2>Create a Note</h2>
      <form id="note-form" novalidate>
        <div class="form-group">
          <label for="title-input">Title (required, max 100 characters):</label>
          <input type="text" id="title-input" name="title" maxlength="100" required>
        </div>

        <div class="form-group">
          <label for="body-input">Body (optional):</label>
          <textarea id="body-input" name="body" rows="4"></textarea>
        </div>

        <button type="submit" id="submit-btn">Create Note</button>
      </form>
    </section>

    <section class="notes-section">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
