<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>QuickNotes System</h1>
      <p>Prototype client interacting with JSONPlaceholder</p>
    </header>

    <main>
      <section class="controls">
        <button id="load-btn" type="button">Load notes</button>
        <p id="status" class="status-msg"></p>
      </section>

      <section class="form-section">
        <h2>Create a Note</h2>
        <form id="note-form">
          <div class="field">
            <label for="title-input">Note Title (Required, max 100 characters):</label>
            <input type="text" id="title-input" maxlength="100" required placeholder="Meeting highlights...">
          </div>

          <div class="field">
            <label for="body-input">Note Body (Optional):</label>
            <textarea id="body-input" rows="4" placeholder="Discussed quarterly roadmap..."></textarea>
          </div>

          <button id="submit-btn" type="submit">Create Note</button>
        </form>
      </section>

      <section class="notes-section">
        <h2>Notes</h2>
        <ul id="notes-list"></ul>
      </section>
    </main>
  </div>
</body>
</html>
